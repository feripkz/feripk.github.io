<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="glitchGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4cfffb" />
      <stop offset="50%" stop-color="#ff40b7" />
      <stop offset="100%" stop-color="#fff275" />
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0.2" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="420" height="420" fill="#050818" />
  <circle cx="210" cy="210" r="160" fill="#0f4775" />
  <g filter="url(#noise)" opacity="0.16">
    <rect x="0" y="0" width="420" height="420" fill="white" />
  </g>
  <circle cx="155" cy="170" r="30" fill="#fff" />
  <circle cx="265" cy="170" r="30" fill="#fff" />
  <circle cx="155" cy="170" r="16" fill="#020b18" />
  <circle cx="265" cy="170" r="16" fill="#020b18" />
  <path d="M132 250 C170 300 250 300 288 250" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" />
  <path d="M132 250 C170 290 250 290 288 250" fill="none" stroke="url(#glitchGradient)" stroke-width="10" stroke-linecap="round" opacity="0.6" />
  <path d="M90 85 H330" stroke="#4cfffb" stroke-width="10" opacity="0.2" />
  <path d="M90 120 H330" stroke="#ff40b7" stroke-width="8" opacity="0.12" />
  <path d="M90 355 H330" stroke="#fff275" stroke-width="8" opacity="0.14" />
  <rect x="50" y="80" width="320" height="38" fill="none" stroke="#4cfffb" stroke-width="4" opacity="0.4" />
  <rect x="50" y="300" width="320" height="38" fill="none" stroke="#ff40b7" stroke-width="4" opacity="0.4" />
</svg>
